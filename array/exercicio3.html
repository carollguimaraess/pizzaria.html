<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let vetor = [0, 1, 2, 4, 6, 8,10];
        let multiplicador = parseInt(prompt("Digite um número"));

        let resultado = vetor.map(vetor => vetor * multiplicador);

        alert(resultado);
    </script>
</body>
</html>
