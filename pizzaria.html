<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
    let valorConta = parseFloat(prompt("Digite o valor da conta!"));
        let numeroClientes = parseFloat(prompt("Digite o numero de clientes!"));

        if( isNaN(valorConta) || isNaN(numeroClientes || valorConta<=0 || numeroClientes<=0)){
            alert("Digite um valor valido.")
        }

        let valorIndividual = valorConta/numeroClientes;

        alert(valorIndividual.toFixed(2));
        
    </script>
</body>

</html>
