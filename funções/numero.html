<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        function maiorNumero() {
            let a = parseFloat(prompt("Digite o primeiro número:"));
            let b = parseFloat(prompt("Digite o segundo número:"));

            if (a > b) {
                alert("O maior número é: " + a);
                return a;
            } else if (b > a) {
                alert("O maior número é: " + b);
                return b;
            } else {
                alert("Os números são iguais: " + a);
                return a;
            }
        }

        const resultado = maiorNumero();
        console.log("Resultado da comparação: " + resultado);

    </script>
</body>

</html>
