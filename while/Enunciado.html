<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contagem Regressiva</title>
</head>

<body>
    <script>
        let contador = parseInt(prompt("Digite um numero"));

        do {
            alert(contador);
            contador--;
        } while (contador >= 1);
    </script>
</body>

</html>
